<!DOCTYPE html>
<html lang="en">
<head>
    <!--
    FILE: index.html
    WHAT THIS FILE DOES:
      This is the web page the nurse opens in the browser.
      It shows a dropdown of all patients.
      When the nurse clicks 'Run AI Triage', it calls the FastAPI backend
      and shows the AI response on screen.


      No frameworks. No npm install. Pure HTML + CSS + JavaScript.
      This file is served by main.py when you open http://localhost:8000
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Triage Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
            color: #222;
        }
        h1 { color: #1a3a5c; border-bottom: 3px solid #1a3a5c; padding-bottom: 10px; }
        .subtitle { color: #555; font-size: 14px; margin-top: -10px; margin-bottom: 25px; }
        .select-area {
            background: white; padding: 20px 25px; border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #1a3a5c; }
        select { width: 100%; padding: 10px; font-size: 15px;
                 border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; }
        button { background-color: #1a3a5c; color: white; border: none;
                 padding: 11px 28px; font-size: 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2a5a8c; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        .patient-card {
            background: #e8f0fe; border-left: 4px solid #1a3a5c;
            padding: 15px 20px; border-radius: 0 8px 8px 0; margin-bottom: 20px;
            display: none;  /* hidden until a patient is selected */
        }
        .patient-card h3 { margin: 0 0 8px 0; color: #1a3a5c; }
        .patient-card p  { margin: 4px 0; font-size: 14px; }
        .result-box {
            background: white; padding: 20px 25px; border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: none;  /* hidden until AI responds */
            white-space: pre-wrap;  /* preserves line breaks in AI response */
            font-size: 15px; line-height: 1.7;
        }
        .result-box h3 { color: #1a3a5c; margin-top: 0; margin-bottom: 15px; }
        .status { color: #555; font-style: italic; margin: 10px 0; font-size: 14px; }
        .error {
            background: #fff0f0; border-left: 4px solid #cc0000;
            padding: 12px 18px; color: #cc0000; border-radius: 0 5px 5px 0;
            display: none;
        }
        .model-tag { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>


    <h1>Hospital Triage Assistant</h1>
    <p class="subtitle">Powered by Groq AI + MySQL | CareSync Training Project</p>


    <!-- Patient selection section -->
    <div class="select-area">
        <label for="patientSelect">Select a Patient:</label>


        <!-- Dropdown is filled by JavaScript when the page loads -->
        <select id="patientSelect" onchange="showPatientInfo()">
            <option value="">-- Loading patients... --</option>
        </select>


        <!-- Patient card: shows name/age after selection -->
        <div class="patient-card" id="patientCard">
            <h3 id="cardName"></h3>
            <p id="cardAge"></p>
            <p id="cardGender"></p>
        </div>


        <button id="triageBtn" onclick="runTriage()" disabled>
            Run AI Triage
        </button>


        <p class="status" id="statusMsg"></p>
        <div class="error" id="errorBox"></div>
    </div>


    <!-- AI response section - shown after triage runs -->
    <div class="result-box" id="resultBox">
        <h3>AI Triage Assessment</h3>
        <div id="aiResult"></div>
        <p class="model-tag" id="modelTag"></p>
    </div>


    <script>
    /*
    JAVASCRIPT SECTION
    This code runs in the browser and talks to our FastAPI backend.
    It has 3 main functions:
      1. loadPatients()    - fills the dropdown when page loads
      2. showPatientInfo() - shows patient card when user selects a patient
      3. runTriage()       - calls the API and shows the AI response
    */


    // Store all patient data loaded from the API
    let allPatients = [];


    // --------------------------------------------------------
    // FUNCTION 1: Load all patients from the backend API
    // Called automatically when the page first loads
    // --------------------------------------------------------
    async function loadPatients() {
        try {
            // Call our FastAPI endpoint: GET /patients
            const response = await fetch('http://localhost:8000/patients');
            const data = await response.json();


            allPatients = data.patients;


            // Fill the dropdown with patient names
            const select = document.getElementById('patientSelect');
            select.innerHTML = '<option value="">-- Select a patient --</option>';


            allPatients.forEach(patient => {
                const option = document.createElement('option');
                option.value = patient.id;
                option.textContent = `${patient.id}. ${patient.name} (${patient.age} yrs, ${patient.gender})`;
                select.appendChild(option);
            });


        } catch (error) {
            // If the backend is not running, show this error message
            document.getElementById('patientSelect').innerHTML =
                '<option value="">Error: Backend not running. Start uvicorn first.</option>';
        }
    }


    // --------------------------------------------------------
    // FUNCTION 2: Show patient basic info when selected
    // --------------------------------------------------------
    function showPatientInfo() {
        const select = document.getElementById('patientSelect');
        const selectedId = parseInt(select.value);


        // Hide result box when switching patients
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('statusMsg').textContent = '';


        if (!selectedId) {
            document.getElementById('patientCard').style.display = 'none';
            document.getElementById('triageBtn').disabled = true;
            return;
        }


        // Find the selected patient in our stored list
        const patient = allPatients.find(p => p.id === selectedId);


        if (patient) {
            document.getElementById('cardName').textContent = patient.name;
            document.getElementById('cardAge').textContent = `Age: ${patient.age} years`;
            document.getElementById('cardGender').textContent = `Gender: ${patient.gender}`;
            document.getElementById('patientCard').style.display = 'block';
            document.getElementById('triageBtn').disabled = false;
        }
    }


    // --------------------------------------------------------
    // FUNCTION 3: Call the triage API and show AI response
    // --------------------------------------------------------
    async function runTriage() {
        const select = document.getElementById('patientSelect');
        const patientId = select.value;


        if (!patientId) return;


        // Disable button and show loading message
        const btn = document.getElementById('triageBtn');
        btn.disabled = true;
        btn.textContent = 'Running...';
        document.getElementById('statusMsg').textContent = 'Sending patient data to Groq AI... please wait.';
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('errorBox').style.display = 'none';


        try {
            // Call our FastAPI endpoint: POST /triage/{patientId}
            const response = await fetch(`http://localhost:8000/triage/${patientId}`, {
                method: 'POST'
            });


            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || 'Unknown error from server');
            }


            const data = await response.json();


            // Show the AI response
            document.getElementById('aiResult').textContent = data.ai_response;
            document.getElementById('modelTag').textContent = `Model used: ${data.model_used}`;
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('statusMsg').textContent = '';


        } catch (error) {
            const errBox = document.getElementById('errorBox');
            errBox.textContent = 'Error: ' + error.message;
            errBox.style.display = 'block';
            document.getElementById('statusMsg').textContent = '';
        }


        // Re-enable the button
        btn.disabled = false;
        btn.textContent = 'Run AI Triage';
    }


    // Load patients as soon as the page opens
    loadPatients();
    </script>


</body>
</html>
